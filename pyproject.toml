[project]
name = "uniquepredict"
version = "0.1.0"
description = "SARDASPORTS — AI-powered football prediction engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "xgboost>=2.1.1",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "scipy>=1.14.1",
    "apscheduler>=3.10.4",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "lightgbm>=4.7.0",
    "shap>=0.52.0",
    "matplotlib>=3.11.2",
    "anthropic>=1.7.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "black>=24.10.0",
    "ruff>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
