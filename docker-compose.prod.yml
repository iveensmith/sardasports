# SARDASPORTS in production: one server, Cloudflare in front.
#
#   visitor -> Cloudflare (DNS, CDN, DDoS, TLS) -> tunnel -> web -> api -> SQLite on disk
#
# Nothing here publishes a port to the internet. The server needs no open inbound ports
# at all: the `cloudflared` container dials out to Cloudflare and traffic arrives over
# that connection. The engine (`api`) is reachable only from `web`, on the private
# compose network.
#
# Run it with:   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Full walkthrough, including first-time data upload and Cloudflare setup: docs/deployment.md
#
# This is separate from docker-compose.yml, which is the local development stack
# (Postgres, Redis, ChromaDB, published ports) and is not what production runs.

name: sardasports

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      # SQLite on the mounted data directory. Four slashes: an absolute path.
      DATABASE_URL: sqlite:////app/data/uniquepredict.db
      # One process and one box: no shared cache is needed, and an unset Redis means
      # "caching off", not an error.
      REDIS_URL: ""
      CHROMA_URL: ""
      CHROMA_PERSIST_DIR: /app/rag/chroma_store
      # The scheduler keeps data, results and models current, and runs only while this
      # process does. See docs/deployment.md "Backups" before relying on it.
      ENABLE_SCHEDULER: "true"
      # The public address, for the links in account e-mails (confirm your address, reset a
      # password). Never taken from a request, so a forged Host header cannot redirect them.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-${NEXT_PUBLIC_SITE_URL:-}}
      # The API runs its sync endpoints on a pool of threads, and glibc gives each
      # thread its own allocation arena and does not hand the memory back. Left alone
      # that inflates the process well past what it actually uses (it reached 3 GB and
      # was killed). Two arenas is the standard cure and costs nothing measurable here.
      MALLOC_ARENA_MAX: "2"
    volumes:
      # Everything the engine writes or needs that is not code lives on the server's
      # disk under ${DATA_DIR}, so a rebuilt image never loses it.
      - ${DATA_DIR:-/srv/sardasports}/data:/app/data
      - ${DATA_DIR:-/srv/sardasports}/models:/app/ml/models
      - ${DATA_DIR:-/srv/sardasports}/chroma:/app/rag/chroma_store
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # The engine holds the match history and its model fits in memory (about 0.5 GB
    # idle, more while a board is computed). Capped well under the box's 4 GB so that
    # a runaway restarts only this container and never starves SSH, the web server and
    # the kernel (a 3 GB cap on a 4 GB box is how the server froze). Rebuilding the
    # images needs memory too, so stop the api for the build if the box is small.
    mem_limit: 2300m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_OPERATOR_NAME: ${NEXT_PUBLIC_OPERATOR_NAME:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    environment:
      # Read at runtime, on the server: the browser never talks to the engine.
      ENGINE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The token is created in the Cloudflare dashboard (Zero Trust > Networks > Tunnels)
    # and its public hostname is pointed at http://web:3000. See docs/deployment.md.
    command: tunnel --no-autoupdate run
    environment:
      # Empty is allowed so the file still parses in no-domain mode (see quicktunnel below).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # NO DOMAIN YET? For testing only. Cloudflare hands out a temporary https address
  # (https://something-random.trycloudflare.com) with no account and no domain. It changes
  # every time this container restarts and has no uptime promise, so it is not for real
  # traffic. Start it with, naming the services so the domain tunnel above is left out:
  #
  #   docker compose -f docker-compose.prod.yml --env-file .env.production
  #     --profile quick up -d --build api web quicktunnel
  #
  # and read the address from:  docker compose -f docker-compose.prod.yml logs quicktunnel
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:3000
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
